<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alertes de modération — AGORA</title>
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
  <a class="lien-evitement" href="#contenu">Aller au contenu</a>
  <header id="app-header"></header>

  <main id="contenu" tabindex="-1">
    <div class="conteneur conteneur-etroit">
      <h1>Alertes de modération</h1>
      <p class="aide">Chaque décision exige une justification écrite. Elle est affichée publiquement sur la fiche concernée et dans le journal de la page « Règles ».</p>

      <section aria-labelledby="titre-lois">
        <h2 id="titre-lois" tabindex="-1">Propositions à valider <span class="aide" id="nb-lois"></span></h2>
        <div id="liste-lois-soumises"></div>
      </section>

      <section aria-labelledby="titre-messages">
        <h2 id="titre-messages" tabindex="-1">Messages signalés <span class="aide" id="nb-messages"></span></h2>
        <div id="liste-messages-signales"></div>
      </section>
    </div>
  </main>

  <footer id="app-footer"></footer>
  <div id="annonce" class="toast" role="status" aria-live="polite"></div>

  <script src="js/app.js?v=3"></script>
  <script src="js/moderation-lois.js?v=3"></script>
</body>
</html>
